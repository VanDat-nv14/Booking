spring.application.name=BookingKhachSan

# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA Configuration
# Use 'none' or 'validate' to preserve existing database schema and triggers
# Changing to update to allow adding new columns (provider, etc)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true
# Fix: SQL Server AFTER INSERT trigger causes "null identifier" because JDBC cannot
# retrieve IDENTITY key when trigger performs DML. This forces use of OUTPUT clause.
spring.jpa.properties.hibernate.jdbc.scroll_fetchsize=100
spring.jpa.properties.hibernate.id.optimizer.pooled.prefer_lo=true

# File Upload Limits (Increase for Base64 image payloads)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-http-form-post-size=50MB

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.example.bookingkhachsan.service=DEBUG
logging.level.com.example.bookingkhachsan.controller=DEBUG

# OAuth2 Configuration (Placeholders)
# Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:placeholder}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:placeholder}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Frontend base url for OAuth2 redirect (do NOT hardcode in code)
app.frontend.base-url=${FRONTEND_URL:http://localhost:5173}

# Facebook
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_APP_ID:placeholder}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_APP_SECRET:placeholder}
spring.security.oauth2.client.registration.facebook.scope=public_profile,email
spring.security.oauth2.client.registration.facebook.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
# Facebook Graph API - yêu cầu rõ ràng các field (mặc định chỉ trả id,name)
spring.security.oauth2.client.provider.facebook.userInfoUri=https://graph.facebook.com/v21.0/me?fields=id,name,email,picture.type(large)

# --- Email (SMTP / Gmail) — CHỈ phục vụ gửi email thật ra ngoài ---
# Cần MAIL_USERNAME + MAIL_PASSWORD đúng (Gmail: bật 2FA + "Mật khẩu ứng dụng").
# Địa chỉ gửi (From) = MAIL_USERNAME; địa chỉ nhận = email khách trong DB.
#
# Thông báo chuông trong app (bảng system_notification) KHÔNG đi qua Gmail:
# hiển thị theo email đăng nhập / tài khoản trong hệ thống, độc lập với cấu hình SMTP.
# ---------------------------------------------------------------------------
# Email Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:placeholder}
spring.mail.password=${MAIL_PASSWORD:placeholder}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.debug=true

# JWT Configuration
application.security.jwt.secret-key=${JWT_SECRET}

# Location seed: set to true to seed provinces/districts from provinces.open-api.vn on startup (only when quoc_gia is empty)
location.seed-on-startup=true

